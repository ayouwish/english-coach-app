# XcodeGen 工程描述 —— 避免手写 pbxproj。
# 在 ios/ 目录执行：brew install xcodegen && xcodegen generate
# 生成产物 EnglishCoach.xcodeproj 不提交（见 ios/.gitignore）。
#
# 目标机：macOS + Xcode 26 + iOS 26 SDK。**当前仓库没有 macOS/Xcode，无法验证生成结果**，
# 只能靠 ios/tools/check_ios.py 做静态验收（契约 §6）。
name: EnglishCoach

options:
  bundleIdPrefix: top.dreamsearch
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  # 空目录不生成 group：ios/App、ios/Core、ios/Features 等设计期占位目录不参与构建。
  generateEmptyDirectories: false

settings:
  base:
    # Swift 6 语言模式 + 完整并发检查：代码按严格并发编写，不使用 @unchecked Sendable 逃避。
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # 无第三方依赖：不引入 SwiftPM，不生成 Package.resolved。

targets:
  EnglishCoach:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    # sources 覆盖 EnglishCoach/ 下全部 .swift；新增源码目录无需改本文件。
    sources:
      - path: EnglishCoach
        # Info.plist 通过 INFOPLIST_FILE 注入，不能再作为资源复制进 bundle，
        # 否则会出现 “Multiple commands produce ... Info.plist”。
        excludes:
          - "Resources/Info.plist"
          - "Resources/PrivacyInfo.xcprivacy"
      # 隐私清单必须进 Copy Bundle Resources；单独声明 buildPhase 避免被当成普通源码文件。
      - path: EnglishCoach/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.dreamsearch.english.coach
        PRODUCT_NAME: EnglishCoach
        INFOPLIST_FILE: EnglishCoach/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        # iPhone + iPad（Q8 提前支持 iPad 全屏）：iPad 上必须原生全屏运行（iPhone 兼容模式
        # 会左右留黑边、横屏更明显），方向见 Info.plist（iPhone 仅竖屏，iPad 支持横竖屏）。
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # 家庭开发账号（Apple Development: 1399362046@qq.com）；换账号时改这里或在 Xcode 里重选。
        DEVELOPMENT_TEAM: "J6K22Y3DU4"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        # App 图标：EnglishCoach/Resources/Assets.xcassets/AppIcon.appiconset（1024×1024，无 alpha）
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 仅竖屏（契约 §5）：Info.plist 同时声明 iPhone / iPad 两套方向。
        # ATS 默认不加例外：不在 Info.plist 写 NSAppTransportSecurity。
        # 不引入第三方依赖；没有 Assets.xcassets 也能构建（仅缺 App 图标）。

  # 测试 target 暂不创建：Tests/UnitTests、Tests/UITests 目前只有 .gitkeep，
  # XcodeGen 会为一个没有任何编译源文件的测试 target 生成无法构建的 bundle，
  # 因此等测试落地（XCTest/XCUITest 源文件加入）后再在这里加：
  #
  #   EnglishCoachTests:
  #     type: bundle.unit-test
  #     platform: iOS
  #     deploymentTarget: "26.0"
  #     sources: [Tests/UnitTests]
  #     dependencies:
  #       - target: EnglishCoach
  #     settings:
  #       base:
  #         PRODUCT_BUNDLE_IDENTIFIER: top.dreamsearch.english.coach.tests
  #
  #   EnglishCoachUITests:
  #     type: bundle.ui-testing
  #     platform: iOS
  #     deploymentTarget: "26.0"
  #     sources: [Tests/UITests]
  #     dependencies:
  #       - target: EnglishCoach

schemes:
  EnglishCoach:
    build:
      targets:
        EnglishCoach: all
    run:
      config: Debug
    archive:
      config: Release
